[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-trash"
version = "0.1.0"
description = "Reversible, workspace-scoped trash for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniil" }]
dependencies = []

[project.scripts]
dsh-trash = "dsh_trash.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
